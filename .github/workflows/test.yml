name: Test

# Every PR into main (the maker's included) builds the game and runs the mind tool check and every headless playtest.
# Turn on "require status checks to pass" for main in the repository settings so a red run cannot merge.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: ubuntu-latest moved to Ubuntu 26.04, where the pinned Playwright (package.json, 1.56.1) cannot install
    # Chromium's system packages ("Playwright does not support chromium on ubuntu26.04-x64") and the job stops before
    # the build. Move this on together with a Playwright version that supports the newer image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
